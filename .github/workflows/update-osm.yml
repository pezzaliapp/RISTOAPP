name: Aggiorna dati OpenStreetMap

on:
  schedule:
    - cron: '17 2 * * *'     # ogni notte alle 02:17 UTC
  workflow_dispatch: {}       # avvio manuale da GitHub > Actions
  push:
    branches: [main]
    paths:
      - 'js/data.js'
      - 'scripts/build-osm.mjs'
      - '.github/workflows/update-osm.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-osm
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scarica locali da OpenStreetMap
        run: node scripts/build-osm.mjs

      - name: Salva i dati nel repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/osm
          git add data/osm
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna dati OSM"
            git pull --rebase
            git push
          fi

      - name: Ripubblica GitHub Pages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
