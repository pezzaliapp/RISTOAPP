name: Verifica titolari

# Ogni ora: verifica automatica dei titolari (meta tag nella home page,
# file .well-known o email del dominio), controllo CIN/Comune, conteggio
# di segnalazioni e contestazioni in UN issue GitHub (solo numeri),
# pulizia dei dati scaduti. Le segnalazioni NON nascondono nulla da sole.
# Richiede il segreto FIREBASE_SERVICE_ACCOUNT (vedi SETUP-FIREBASE.md):
# senza segreto il job termina subito senza errori.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read     # checkout dello script
  issues: write      # issue "RistoApp: segnalazioni da controllare" (solo conteggi)

concurrency:
  group: verify-owners
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Controlla il segreto
        id: secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Segreto FIREBASE_SERVICE_ACCOUNT non impostato: verifica automatica saltata (vedi SETUP-FIREBASE.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: '20'

      - name: Installa firebase-admin (cartella temporanea, niente package.json nel repo)
        if: steps.secret.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/verify-deps"
          cd "$RUNNER_TEMP/verify-deps"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --loglevel=error firebase-admin@12

      - name: Verifica
        if: steps.secret.outputs.ok == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VERIFY_DEPS_DIR: ${{ runner.temp }}/verify-deps
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-owners.mjs
