name: Aggiorna dati Italia (OpenStreetMap)

# Scarica l'estratto ufficiale OSM dell'Italia da Geofabrik, ne ricava
# tutti i locali e le localita' e li salva in data/ (servito da GitHub
# Pages insieme all'app). Nessun uso dei server Overpass.

on:
  schedule:
    - cron: '23 3 * * 1'     # ogni lunedi' alle 03:23 UTC
  workflow_dispatch: {}       # avvio manuale da GitHub > Actions
  push:
    branches: [main]
    paths:
      - 'scripts/build_italia.py'
      - '.github/workflows/update-italia.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-italia
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installa strumenti OSM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install osmium

      - name: Scarica estratto Italia (Geofabrik)
        run: |
          curl -fL --retry 5 --retry-delay 30 --retry-all-errors \
            -o italy.osm.pbf https://download.geofabrik.de/europe/italy-latest.osm.pbf
          ls -lh italy.osm.pbf

      - name: Filtra locali, alloggi, parcheggi e localita'
        run: |
          osmium tags-filter italy.osm.pbf \
            nwr/amenity=restaurant,fast_food,pub,bar,cafe,biergarten,food_court,ice_cream \
            nwr/tourism=guest_house,hotel,motel,hostel,apartment,chalet \
            nw/amenity=parking \
            n/place=city,town,village,suburb,quarter,hamlet \
            -o filtered.osm.pbf --overwrite
          ls -lh filtered.osm.pbf
          rm italy.osm.pbf

      - name: Costruisci i dati per l'app
        run: python3 scripts/build_italia.py filtered.osm.pbf data

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git rm -r -q --ignore-unmatch data/osm
          git add -A data
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -q -m "Aggiorna dati Italia da OpenStreetMap"
            git pull --rebase -q
            git push
          fi
          du -sh data

      - name: Ripubblica GitHub Pages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
